name: Spring Boot CI/CD with Docker Hub

on:
  push:
    branches:
      - test

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  EC2_HOST: ${{ secrets.EC2_HOST }}
  REMOTE_USER: ${{ secrets.REMOTE_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  IMAGE_TAG_SHA: ${{ github.sha }}
  BUILD_DIRECTORY: build/libs
  DOCKERFILE_JAR_PATH_ARG: build/libs/*.jar
  CONTAINER_NAME: nursing-care
  HOST_PORT: 8080
  CONTAINER_PORT: 8080

jobs:
  build_and_push_docker_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Spring Boot application
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to AWS ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}
          username: AWS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          platforms: linux/arm64
          build-args: |
            AWS_ACCESS_KEY=${{ env.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET_NAME=${{ env.S3_BUCKET_NAME }}
            AWS_REGION=${{ env.AWS_REGION }}
          cache-from: type=github,ref=${{ github.ref }}
          cache-to: type=inline

      - name: Execute deployment script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            echo "--- 배포 시작 ---"
            echo "EC2 서버에서 Docker Install 스크립트 실행"
            /home/ubuntu/script/docker_setting.sh || true
            
            echo "EC2 서버에서 AWS CLI Install 스크립트 실행"
            /home/ubuntu/script/awscli_setting.sh || true
            
            export AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
            export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
            aws configure list
            
            echo "ECR 에서 이미지 풀 및 Docker 컨테이너 재실행"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            echo "ECR 로그인 완료"

            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
            echo "ECR 이미지 풀 완료: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest"

            echo "기존 Docker 컨테이너 (${{ env.CONTAINER_NAME }}) 중지 및 제거"
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            echo "기존 컨테이너 처리 완료"

            echo "새 Docker 컨테이너 (${{ env.CONTAINER_NAME }}) 실행"
            docker run -d -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} --name ${{ env.CONTAINER_NAME }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
            echo "새 컨테이너 실행 명령 완료"


            echo "--- 배포 완료 ---"